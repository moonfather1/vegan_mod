plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
    repositories {
        maven { url "https://maven.shedaniel.me/" }
    }

	maven {
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
/////////
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        // forRepositories(fg.repository) // Uncomment when using ForgeGradle
        filter {
            includeGroup "maven.modrinth"
        }
    }
    ////////////
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    ///////////
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    //////
     exclusiveContent {
        forRepository {
            maven {
                name = "ModMaven"
                url = "https://modmaven.dev"
            }
        }
        filter {
            includeGroup "mezz.jei"
        }
    }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"vegan_mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    //modImplementation "maven.modrinth:ohNO6lps:N5qzq0XV"  // FCAPI
    api("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.1.5")
    //compileOnly("mezz.jei:jei-26.1.2-fabric-api:29.37.0.98")
    compileOnly("mezz.jei:jei-26.1.1-fabric-api:29.3.0.22")
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:26.1.819"
    api "me.shedaniel.cloth:basic-math:+"
    compileOnly "maven.modrinth:lhGA9TYQ:k9DCEQ4B"  //architectury
    //compileOnly "curse.maven:roughly-enough-items-310111:8271476"
    //compileOnly ("curse.maven:cloth-config-348521:7817582") { transitive = true }
    compileOnly "maven.modrinth:5VolwT6c:Pwofj04I"  // rrv

    compileOnly "curse.maven:jade-324717:8652624"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}